name: Báo lỗi
description: Một chức năng chạy sai so với mong đợi
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Khu vực
      options: [Frontend, Backend, AI tra cứu, Hạ tầng / CI, Khác]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. Mở ...
        2. Bấm ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi và kết quả thực tế
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Môi trường
      description: Local / dev, trình duyệt, commit hoặc nhánh
  - type: markdown
    attributes:
      value: Không dán token, mật khẩu, file `.env` hay dữ liệu cá nhân vào issue.
