name: Verify application
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: -Xmx512m -XX:MaxMetaspaceSize=256m -XX:+UseSerialGC
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nutrition_dev
          POSTGRES_USER: nutrition_dev
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nutrition_dev -d nutrition_dev"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -ntp verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run format:check && npm run lint && npm run typecheck && npm test -- --maxWorkers=1 && npm run build
        working-directory: frontend
