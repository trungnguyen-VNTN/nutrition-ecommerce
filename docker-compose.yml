services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nutrition_dev
      POSTGRES_USER: nutrition_dev
      # Local disposable development database only; never expose this port publicly.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - nutrition_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition_dev -d nutrition_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  nutrition_catalog_data:
