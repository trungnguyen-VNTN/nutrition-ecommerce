spring.application.name=nutrition-api
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/nutrition_dev}
spring.datasource.username=${DB_USERNAME:nutrition_dev}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration
spring.jackson.property-naming-strategy=SNAKE_CASE
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
# Invariant 4: never log request bodies, headers (Authorization) or SQL parameters.
spring.mvc.log-request-details=false
server.tomcat.accesslog.enabled=false
logging.level.org.springframework.jdbc.core=INFO
# Product images (D21): JPEG/PNG/WebP up to 2 MB, at most 5 per product.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
nutrition.images.storage=local
nutrition.images.local-dir=${IMAGES_LOCAL_DIR:../.local-run/images}
nutrition.images.public-base-url=/api/local-images
