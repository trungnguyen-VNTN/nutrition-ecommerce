spring.application.name=nutrition-api
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/nutrition_dev}
spring.datasource.username=${DB_USERNAME:nutrition_dev}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.locations=classpath:db/migration
spring.jackson.property-naming-strategy=SNAKE_CASE
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
